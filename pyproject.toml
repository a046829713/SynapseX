[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapsex"
version = "0.1.0"
description = "Reinforcement learning and neural network trading platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SynapseX Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "gymnasium>=0.29.1",
    "numba>=0.60.0",
    "einops>=0.8.0",
    "quantstats>=0.0.64",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "python-binance>=1.0.19",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "yfinance>=1.5.0",
    "tqdm>=4.66.0",
    "packaging>=24.0",
    "requests>=2.31.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "peewee>=4.3.0",
]

[project.optional-dependencies]
# Experiment tracking and logging
tracking = [
    "tensorboardX>=2.6.0",
    "wandb>=0.16.0",
    "torchsummary>=1.5.1",
]

# NLP and tokenization
nlp = [
    "sentencepiece>=0.2.0",
    "transformers>=5.0.0",
    "tokenizers>=0.22.0",
]

# Development, formatting and testing
dev = [
    "ipython>=8.20.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

# All optional dependencies combined
all = [
    "synapsex[tracking,nlp,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "Brain*",
    "Command*",
    "Database*",
    "Infrastructure*",
    "LogRecord*",
    "Major*",
    "nested_learning*",
    "process_map*",
    "utils*",
    "configs*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
