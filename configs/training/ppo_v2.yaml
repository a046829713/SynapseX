SAVES_TAG: saves
BARS_COUNT: 300
UNIQUE_SYMBOLS:
EXCLUDE_SYMBOLS:
  - "USDCUSDT-F-30-Min"
  - "STRCUSDT-F-30-Min"
TRAIN_END_DATE: "2025-12-31 23:59:59"
TEST_START_DATE: "2026-01-01 00:00:00"
TEST_END_DATE: null
MODEL_DEFAULT_COMMISSION_PERC_TRAING: 0.0001
DEFAULT_SLIPPAGE: 0.0001
NUM_WORKERS: 8
HORIZON_STEPS: 512
EPISODE_STEPS: 512

# PPO Hyperparameters
LEARNING_RATE: 0.0002
WEIGHT_DECAY: 0
BASE_LR: 0.0001
BATCH_SIZE: 256
PPO_EPOCHS: 2
CLIP_EPS: 0.2
VF_COEF: 0.5
ENT_COEF: 0.001
INIT_LOG_STD: 0.0
LOG_STD_MIN: -5.0
LOG_STD_MAX: 1.0
TARGET_KL: 0.015
MAX_GRAD_NORM: 0.5
CHECKPOINT_EVERY_ITER: 10
GAMMA: 0.99
GAE_LAMBDA: 0.95

# Model Architecture (Mamba2 Continuous Actor-Critic)
HIDDEN_SIZE: 256
NLAYERS: 4
TIME_FEATURES_OUT: 32
PORTFOLIO_DIM: 3

# SSM / Mamba2 Configuration
SSM_CFG:
  layer: "Mamba2"
  expand: 2           # d_inner = 256 * 2 = 512
  d_ssm: 256           # 核心關鍵: 512 維中，256 維走 SSM，剩餘 256 維走 Gated MLP
  headdim: 32         # nheads = 256 // 32 = 3 個 SSM 頭
  d_state: 64         # 狀態維度
  ngroups: 2
  chunk_size: 64
  d_conv: 4
  rmsnorm: true
  bias: false
  conv_bias: true

# Environment Rebalance & Reward Parameters
DEADZONE_THRESHOLD: 0.01
REBALANCE_THRESHOLD: 0.05
W1_STEP_RETURN: 100.0